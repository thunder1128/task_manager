<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タスク管理</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #172b4d;
    --muted: #6b778c;
    --border: #dfe1e6;
    --accent: #4361ee;
    --accent-dark: #3a52cc;
    --done: #36b37e;
    --p-high: #e5484d;
    --p-mid: #f0a500;
    --p-low: #6b778c;
    --shadow: 0 1px 3px rgba(9,30,66,.13);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 10;
    flex-wrap: wrap;
  }
  header h1 { font-size: 20px; font-weight: 700; }
  header .stats { color: var(--muted); font-size: 13px; }
  header .spacer { flex: 1; }
  .btn {
    border: none; border-radius: 6px; padding: 9px 16px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background .15s, opacity .15s;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-ghost { background: transparent; color: var(--muted); }
  .btn-ghost:hover { background: var(--bg); }
  .btn-sm { padding: 6px 12px; font-size: 13px; }

  .tabs { display: flex; background: var(--bg); border-radius: 8px; padding: 3px; }
  .tab {
    border: none; background: transparent; cursor: pointer;
    padding: 7px 16px; border-radius: 6px; font-size: 14px; font-weight: 600; color: var(--muted);
  }
  .tab.active { background: var(--card); color: var(--text); box-shadow: var(--shadow); }

  .toolbar {
    padding: 16px 24px 0; display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
  }
  .toolbar input, .toolbar select {
    border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px;
    font-size: 14px; background: var(--card); color: var(--text);
  }
  .toolbar input[type="search"] { min-width: 220px; }

  .view { display: none; }
  .view.active { display: block; }

  /* ---- ボード(かんばん・動的列) ---- */
  .board {
    display: flex; gap: 16px; padding: 16px 24px 40px;
    overflow-x: auto; align-items: flex-start;
  }
  .column {
    background: #ebecf0; border-radius: 10px; padding: 10px;
    width: 300px; flex: 0 0 300px; display: flex; flex-direction: column;
  }
  .column.dragover, .panel.dragover { outline: 2px dashed var(--accent); outline-offset: -2px; }
  .cards.dragover, .panel-cards.dragover { background: rgba(67,97,238,.06); border-radius: 8px; }
  .column-head {
    display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; padding: 6px 4px 10px;
  }
  .column-head .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
  .column-head.is-done .dot { background: var(--done); }
  .column-head .cname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .column-head .count {
    background: rgba(9,30,66,.08); color: var(--muted);
    font-size: 12px; border-radius: 10px; padding: 1px 8px; flex: none;
  }
  .column-head .col-actions { margin-left: auto; display: flex; gap: 2px; flex: none; }
  .cards { display: flex; flex-direction: column; gap: 8px; min-height: 20px; }

  .add-column { flex: 0 0 220px; }
  .add-column button {
    width: 100%; border: 2px dashed var(--border); background: transparent;
    border-radius: 10px; padding: 14px; color: var(--muted); font-size: 14px;
    font-weight: 600; cursor: pointer;
  }
  .add-column button:hover { border-color: var(--accent); color: var(--accent); background: rgba(67,97,238,.04); }

  /* ---- バックログ ---- */
  .backlog-wrap { padding: 16px 24px 40px; display: flex; flex-direction: column; gap: 16px; }
  .panel { background: #ebecf0; border-radius: 10px; padding: 12px; }
  .panel.backlog-panel { background: #e3e9f5; }
  .panel-head { display: flex; align-items: center; gap: 10px; padding: 4px 6px 12px; flex-wrap: wrap; }
  .panel-head .pname { font-weight: 700; font-size: 15px; }
  .panel-head .pgoal { color: var(--muted); font-size: 12px; width: 100%; padding-left: 2px; }
  .panel-head .pdate { color: var(--muted); font-size: 12px; }
  .panel-head .pactions { display: flex; gap: 4px; }
  .iter-status { font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 10px; }
  .iter-status.planned { background: #ebecf0; color: var(--muted); border: 1px solid var(--border); }
  .iter-status.active  { background: #fff7e6; color: #b87503; }
  .iter-status.done    { background: #e3fcef; color: var(--done); }
  .panel-cards { display: flex; flex-direction: column; gap: 8px; min-height: 24px; }
  .panel-head .count {
    margin-left: auto; background: rgba(9,30,66,.08); color: var(--muted);
    font-size: 12px; border-radius: 10px; padding: 1px 8px;
  }

  /* ---- カード共通 ---- */
  .card {
    background: var(--card); border-radius: 8px; padding: 12px;
    box-shadow: var(--shadow); cursor: grab; border-left: 3px solid transparent;
  }
  .card:active { cursor: grabbing; }
  .card.dragging { opacity: .4; }
  .card.p-high { border-left-color: var(--p-high); }
  .card.p-mid  { border-left-color: var(--p-mid); }
  .card.p-low  { border-left-color: var(--p-low); }
  .card.done .card-title { text-decoration: line-through; color: var(--muted); }

  .card-title { font-weight: 600; font-size: 14px; word-break: break-word; }
  .card-desc { font-size: 12px; color: var(--muted); margin-top: 4px; white-space: pre-wrap; word-break: break-word; }
  .card-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
  .badge-prio.p-high { background: #ffebe6; color: var(--p-high); }
  .badge-prio.p-mid  { background: #fff7e6; color: #b87503; }
  .badge-prio.p-low  { background: #ebecf0; color: var(--p-low); }
  .badge-cat { background: #e9f2ff; color: var(--accent); }
  .badge-tag { background: #f4f5f7; color: var(--muted); border: 1px solid var(--border); }
  .badge-due { background: #ebecf0; color: var(--muted); }
  .badge-due.overdue { background: #ffebe6; color: var(--p-high); }
  .badge-due.soon { background: #fff7e6; color: #b87503; }
  .badge-iter { background: #ede7fb; color: #6741d9; }
  .badge-type { background: #d9f0ff; color: #0b6bcb; border: 1px solid #b7e0ff; }
  .badge-col { background: #ebecf0; color: var(--muted); }
  .badge-col.done { background: #e3fcef; color: var(--done); }

  .card-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .icon-btn {
    border: none; background: transparent; cursor: pointer;
    color: var(--muted); font-size: 12px; padding: 2px 6px; border-radius: 4px;
  }
  .icon-btn:hover { background: var(--bg); color: var(--text); }
  .icon-btn.danger:hover { background: #ffebe6; color: var(--p-high); }
  .icon-btn:disabled { opacity: .3; cursor: default; }

  /* ---- モーダル ---- */
  .overlay {
    position: fixed; inset: 0; background: rgba(9,30,66,.5);
    display: none; align-items: flex-start; justify-content: center;
    padding: 60px 16px; z-index: 50; overflow-y: auto;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--card); border-radius: 10px; width: 100%; max-width: 480px;
    padding: 24px; box-shadow: 0 8px 24px rgba(9,30,66,.25);
  }
  .modal h2 { font-size: 18px; margin-bottom: 16px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: var(--muted); }
  .field input, .field textarea, .field select {
    width: 100%; border: 1px solid var(--border); border-radius: 6px;
    padding: 9px 10px; font-size: 14px; font-family: inherit; color: var(--text);
  }
  .field textarea { resize: vertical; min-height: 64px; }
  .field-row { display: flex; gap: 12px; }
  .field-row .field { flex: 1; }
  .check { display: flex; align-items: center; gap: 8px; }
  .check input { width: auto; }
  .check label { margin: 0; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
  .empty { text-align: center; color: var(--muted); font-size: 13px; padding: 16px 0; }
  .form-error { color: var(--p-high); font-size: 13px; margin-bottom: 10px; min-height: 18px; }
  .btn-danger { background: var(--p-high); color: #fff; }
  .btn-danger:hover { opacity: .88; }

  /* ---- ログイン画面 ---- */
  .auth-screen {
    position: fixed; inset: 0; background: var(--bg);
    display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px;
  }
  .auth-screen.open { display: flex; }
  .auth-card {
    background: var(--card); border-radius: 12px; width: 100%; max-width: 360px;
    padding: 32px 28px; box-shadow: 0 8px 30px rgba(9,30,66,.18);
  }
  .auth-card h1 { font-size: 22px; margin-bottom: 4px; }
  .auth-card .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .auth-card .btn-primary { width: 100%; margin-top: 6px; }

  /* ---- ヘッダーのプロジェクト/ユーザー ---- */
  header select.proj-select {
    border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px;
    font-size: 14px; font-weight: 600; background: var(--card); color: var(--text); max-width: 220px;
  }
  .user-badge { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .user-badge .uname { font-weight: 700; color: var(--text); }
  .user-badge .tag-admin {
    background: var(--accent); color: #fff; font-size: 11px; font-weight: 700;
    border-radius: 10px; padding: 1px 8px;
  }
  .role-pill {
    font-size: 11px; font-weight: 700; border-radius: 10px; padding: 1px 8px;
    background: rgba(9,30,66,.08); color: var(--muted);
  }
  .role-pill.owner { background: rgba(67,97,238,.14); color: var(--accent-dark); }

  /* ---- 一覧(メンバー/ユーザー) ---- */
  .list-row {
    display: flex; align-items: center; gap: 10px; padding: 10px 4px;
    border-bottom: 1px solid var(--border);
  }
  .list-row:last-child { border-bottom: none; }
  .list-row .grow { flex: 1; }
  .list-row .name { font-weight: 600; font-size: 14px; }
  .inline-form { display: flex; gap: 8px; align-items: flex-end; margin-top: 12px; flex-wrap: wrap; }
  .inline-form .field { margin-bottom: 0; flex: 1; min-width: 140px; }
</style>
</head>
<body>
<header id="appHeader" style="display:none;">
  <h1>📋 タスク管理</h1>
  <select class="proj-select" id="projectSelect" title="プロジェクトを切り替え"></select>
  <button class="btn btn-ghost btn-sm" id="manageProjectBtn" title="メンバー・設定">⚙ プロジェクト</button>
  <span class="stats" id="stats"></span>
  <span class="spacer"></span>
  <div class="tabs">
    <button class="tab active" data-view="board" id="tab-board">かんばん</button>
    <button class="tab" data-view="backlog" id="tab-backlog">バックログ</button>
  </div>
  <button class="btn btn-primary" id="addBtn">+ 新規タスク</button>
  <span class="user-badge" id="userBadge">
    <span class="uname" id="userName"></span>
    <button class="btn btn-ghost btn-sm" id="adminBtn" style="display:none;">👤 ユーザー管理</button>
    <button class="btn btn-ghost btn-sm" id="logoutBtn">ログアウト</button>
  </span>
</header>

<!-- ログイン画面 -->
<div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <h1>📋 タスク管理</h1>
    <div class="sub">ログインしてください</div>
    <form id="loginForm">
      <div class="form-error" id="loginError"></div>
      <div class="field">
        <label for="login-user">ユーザー名</label>
        <input type="text" id="login-user" required autocomplete="username" autofocus>
      </div>
      <div class="field">
        <label for="login-pass">パスワード</label>
        <input type="password" id="login-pass" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary">ログイン</button>
    </form>
  </div>
</div>

<!-- プロジェクト未選択時の案内 -->
<div class="view" id="view-noproject" style="padding:60px 24px; text-align:center;">
  <p style="color:var(--muted); margin-bottom:16px;">参加しているプロジェクトがありません。</p>
  <button class="btn btn-primary" id="createFirstProjectBtn">+ プロジェクトを作成</button>
</div>

<!-- ボード用ツールバー -->
<div class="toolbar" id="toolbar">
  <input type="search" id="search" placeholder="🔍 タイトル・説明で検索">
  <select id="filterPriority">
    <option value="">優先度: すべて</option>
    <option value="high">高</option>
    <option value="mid">中</option>
    <option value="low">低</option>
  </select>
  <select id="filterCategory"><option value="">カテゴリ: すべて</option></select>
  <select id="filterTag"><option value="">タグ: すべて</option></select>
  <select id="filterIteration"><option value="">イテレーション: すべて</option></select>
  <select id="filterType"><option value="">種別: すべて</option></select>
  <span class="spacer"></span>
  <button class="btn btn-ghost btn-sm" id="manageTypesBtn">🏷 種別を管理</button>
</div>

<!-- ボードビュー(列はJSで動的生成) -->
<div class="view active" id="view-board">
  <div class="board" id="board"></div>
</div>

<!-- バックログビュー -->
<div class="view" id="view-backlog">
  <div class="toolbar">
    <strong style="font-size:15px;">イテレーション計画</strong>
    <span class="spacer"></span>
    <button class="btn btn-primary btn-sm" id="addIterBtn">+ イテレーション追加</button>
  </div>
  <div class="backlog-wrap" id="backlogWrap"></div>
</div>

<!-- タスクモーダル -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">新規タスク</h2>
    <form id="taskForm">
      <input type="hidden" id="taskId">
      <div class="field">
        <label for="f-title">タイトル *</label>
        <input type="text" id="f-title" required maxlength="200" autocomplete="off">
      </div>
      <div class="field">
        <label for="f-desc">説明</label>
        <textarea id="f-desc" maxlength="2000"></textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="f-column">列(ステータス)</label>
          <select id="f-column"></select>
        </div>
        <div class="field">
          <label for="f-priority">優先度</label>
          <select id="f-priority">
            <option value="high">高</option>
            <option value="mid" selected>中</option>
            <option value="low">低</option>
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="f-iteration">イテレーション</label>
          <select id="f-iteration"><option value="">バックログ(未割り当て)</option></select>
        </div>
        <div class="field">
          <label for="f-type">種別</label>
          <select id="f-type"><option value="">種別なし</option></select>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="f-due">期限</label>
          <input type="date" id="f-due">
        </div>
        <div class="field">
          <label for="f-category">カテゴリ</label>
          <input type="text" id="f-category" maxlength="40" autocomplete="off" placeholder="例: 開発">
        </div>
      </div>
      <div class="field">
        <label for="f-tags">タグ(カンマ区切り)</label>
        <input type="text" id="f-tags" autocomplete="off" placeholder="例: 緊急, 顧客A">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="cancelBtn">キャンセル</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- 列モーダル -->
<div class="overlay" id="colOverlay">
  <div class="modal">
    <h2 id="colModalTitle">新規列</h2>
    <form id="colForm">
      <input type="hidden" id="colId">
      <div class="field">
        <label for="c-name">列名 *</label>
        <input type="text" id="c-name" required maxlength="40" autocomplete="off" placeholder="例: レビュー中">
      </div>
      <div class="field check">
        <input type="checkbox" id="c-done">
        <label for="c-done">この列に入ったタスクを「完了」として扱う(進捗率・取り消し線に反映)</label>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="colCancelBtn">キャンセル</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- イテレーションモーダル -->
<div class="overlay" id="iterOverlay">
  <div class="modal">
    <h2 id="iterModalTitle">新規イテレーション</h2>
    <form id="iterForm">
      <input type="hidden" id="iterId">
      <div class="field">
        <label for="i-name">名前 *</label>
        <input type="text" id="i-name" required maxlength="80" autocomplete="off" placeholder="例: Sprint 1">
      </div>
      <div class="field">
        <label for="i-goal">ゴール</label>
        <textarea id="i-goal" maxlength="500" placeholder="このイテレーションで達成したいこと"></textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="i-start">開始日</label>
          <input type="date" id="i-start">
        </div>
        <div class="field">
          <label for="i-end">終了日</label>
          <input type="date" id="i-end">
        </div>
      </div>
      <div class="field">
        <label for="i-status">状態</label>
        <select id="i-status">
          <option value="planned">計画中</option>
          <option value="active">進行中</option>
          <option value="done">完了</option>
        </select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="iterCancelBtn">キャンセル</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- 種別(タスクタイプ)管理モーダル -->
<div class="overlay" id="typeOverlay">
  <div class="modal">
    <h2>種別の管理</h2>
    <div style="font-size:12px; color:var(--muted); margin-bottom:10px;">
      このプロジェクトのタスクに付けられる種別を追加・改名・削除できます。
      種別を削除しても、その種別が付いていたタスクは消えず「種別なし」に戻ります。
    </div>
    <div id="type-list"></div>
    <form id="addTypeForm" class="inline-form">
      <div class="field">
        <label for="t-name">種別を追加</label>
        <input type="text" id="t-name" maxlength="40" autocomplete="off" placeholder="例: 設計, ドキュメント">
      </div>
      <button type="submit" class="btn btn-primary btn-sm">追加</button>
    </form>
    <div class="form-error" id="type-error"></div>
    <div class="modal-actions" style="margin-top:12px;">
      <button type="button" class="btn btn-ghost" id="typeCloseBtn">閉じる</button>
    </div>
  </div>
</div>

<!-- プロジェクト作成/リネーム モーダル -->
<div class="overlay" id="projOverlay">
  <div class="modal">
    <h2 id="projModalTitle">新規プロジェクト</h2>
    <form id="projForm">
      <input type="hidden" id="projId">
      <div class="form-error" id="projError"></div>
      <div class="field">
        <label for="p-name">プロジェクト名 *</label>
        <input type="text" id="p-name" required maxlength="80" autocomplete="off" placeholder="例: 新規Webサイト開発">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="projCancelBtn">キャンセル</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- プロジェクト管理(メンバー)モーダル -->
<div class="overlay" id="manageOverlay">
  <div class="modal">
    <h2>プロジェクト管理</h2>
    <div class="field">
      <label>プロジェクト名</label>
      <div style="display:flex; gap:8px; align-items:center;">
        <strong id="mg-projname" style="font-size:15px;"></strong>
        <button class="btn btn-ghost btn-sm" id="mg-rename" style="display:none;">✎ 改名</button>
      </div>
    </div>
    <div class="field">
      <label>メンバー</label>
      <div id="mg-members"></div>
    </div>
    <form id="addMemberForm" class="inline-form" style="display:none;">
      <div class="field">
        <label for="mg-username">ユーザー名を追加</label>
        <input type="text" id="mg-username" autocomplete="off" placeholder="既存ユーザー名">
      </div>
      <div class="field" style="flex:0 0 120px;">
        <label for="mg-role">権限</label>
        <select id="mg-role">
          <option value="member">メンバー</option>
          <option value="owner">オーナー</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary btn-sm">追加</button>
    </form>
    <div class="form-error" id="mg-error"></div>

    <div class="field" id="mg-slack-section" style="display:none; border-top:1px solid var(--border); padding-top:14px; margin-top:6px;">
      <label for="mg-slack">Slack通知 (Incoming Webhook URL)</label>
      <div style="font-size:12px; color:var(--muted); margin-bottom:6px;">
        設定すると、このプロジェクトにタスクを追加したとき指定チャンネルへ自動投稿します。空欄で無効。
      </div>
      <div style="display:flex; gap:8px; align-items:center;">
        <input type="url" id="mg-slack" autocomplete="off" placeholder="https://hooks.slack.com/services/..." style="flex:1;">
        <button type="button" class="btn btn-primary btn-sm" id="mg-slack-save">保存</button>
      </div>
      <div class="form-error" id="mg-slack-msg" style="color:var(--muted);"></div>
    </div>

    <div class="modal-actions" style="margin-top:16px; justify-content:space-between;">
      <button type="button" class="btn btn-danger btn-sm" id="mg-delete" style="display:none;">プロジェクトを削除</button>
      <button type="button" class="btn btn-ghost" id="manageCloseBtn">閉じる</button>

</div>

<!-- ユーザー管理(管理者)モーダル -->
<div class="overlay" id="adminOverlay">
  <div class="modal">
    <h2>ユーザー管理(管理者)</h2>
    <div id="admin-users"></div>
    <form id="createUserForm" class="inline-form">
      <div class="field">

        <input type="text" id="au-username" autocomplete="off" placeholder="新規ユーザー名">

        <label for="au-password">初期パスワード</label>
        <input type="text" id="au-password" autocomplete="off" placeholder="4文字以上">
      </div>
      <div class="field check" style="flex:0 0 auto; align-self:center; margin-top:18px;">
        <input type="checkbox" id="au-admin"><label for="au-admin">管理者</label>
      </div>
      <button type="submit" class="btn btn-primary btn-sm">作成</button>

    <div class="form-error" id="au-error"></div>

      <button type="button" class="btn btn-ghost" id="adminCloseBtn">閉じる</button>
    </div>

<script>
const TASK_API = "/api/tasks";
const COL_API = "/api/columns";
const ITER_API = "/api/iterations";
const TYPE_API = "/api/task_types";
const PRIO_LABEL = { high: "高", mid: "中", low: "低" };
const ITER_STATUS_LABEL = { planned: "計画中", active: "進行中", done: "完了" };

let tasks = [];
let columns = [];
let iterations = [];
let taskTypes = [];
let currentView = "board";
let dropDone = false;

// 認証・プロジェクト状態
let currentUser = null;
let projects = [];
let activeProjectId = null;
const LS_PROJECT = "tm_active_project";

// ---- API ----
async function api(base, method, path = "", body) {
  const opts = { method, headers: { "Content-Type": "application/json" } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(base + path, opts);
  if (res.status === 401) {
    showAuthScreen();
    throw new Error("ログインが必要です");
  }
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || `HTTP ${res.status}`);
  }
  return res.status === 204 ? null : res.json();
}
function activeProject() { return projects.find(p => p.id === activeProjectId) || null; }
function isOwner() { const p = activeProject(); return !!(p && p.my_role === "owner"); }

async function load() {
  if (!activeProjectId) { tasks = []; columns = []; iterations = []; taskTypes = []; render(); return; }
  const q = `?project_id=${activeProjectId}`;
  try {
    [tasks, columns, iterations, taskTypes] = await Promise.all([
      api(TASK_API, "GET", q),
      api(COL_API, "GET", q),
      api(ITER_API, "GET", q),
      api(TYPE_API, "GET", q),
    ]);
    render();
  } catch (e) {
    alert("読み込みに失敗しました: " + e.message);
  }
}
function typeName(id) { const t = taskTypes.find(x => x.id === id); return t ? t.name : null; }

// ---- ユーティリティ ----
function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fmtDue(due, done) {
  if (!due) return null;
  const d = new Date(due + "T00:00:00");
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const diff = Math.round((d - today) / 86400000);
  let cls = "", label = `${d.getMonth() + 1}/${d.getDate()}`;
  // 完了タスクは超過・期限間近などの緊急表示を出さない(素の日付のみ)
  if (done) return { cls: "", label };
  if (diff < 0) { cls = "overdue"; label += ` (${-diff}日超過)`; }
  else if (diff === 0) { cls = "soon"; label += " (今日)"; }
  else if (diff <= 2) { cls = "soon"; label += ` (あと${diff}日)`; }
  return { cls, label };
}
function fmtDateShort(d) {
  if (!d) return "";
  const dt = new Date(d + "T00:00:00");
  return `${dt.getMonth() + 1}/${dt.getDate()}`;
}
function iterName(id) { const it = iterations.find(i => i.id === id); return it ? it.name : null; }
function columnById(id) { return columns.find(c => c.id === id) || null; }
function isDoneTask(t) { const c = columnById(t.column_id); return !!(c && c.is_done); }

// ---- フィルター(ボード) ----
function getFilters() {
  return {
    q: document.getElementById("search").value.trim().toLowerCase(),
    priority: document.getElementById("filterPriority").value,
    category: document.getElementById("filterCategory").value,
    tag: document.getElementById("filterTag").value,
    iteration: document.getElementById("filterIteration").value,
    type: document.getElementById("filterType").value,
  };
}
function matchFilter(t, f) {
  if (f.q && !(t.title.toLowerCase().includes(f.q) ||
      (t.description || "").toLowerCase().includes(f.q))) return false;
  if (f.priority && t.priority !== f.priority) return false;
  if (f.category && t.category !== f.category) return false;
  if (f.tag && !(t.tags || []).includes(f.tag)) return false;
  if (f.iteration === "none" && t.iteration_id != null) return false;
  if (f.iteration && f.iteration !== "none" && String(t.iteration_id) !== f.iteration) return false;
  if (f.type === "none" && t.type_id != null) return false;
  if (f.type && f.type !== "none" && String(t.type_id) !== f.type) return false;
  return true;
}

// ---- 描画 ----
function render() {
  refreshFilterOptions();
  refreshIterationSelects();
  refreshColumnSelect();
  refreshTypeSelect();
  if (currentView === "board") renderBoard();
  else renderBacklog();
  renderStats();
}

function renderStats() {
  const total = tasks.length;
  const done = tasks.filter(isDoneTask).length;
  document.getElementById("stats").textContent =
    total ? `全${total}件 / 完了${done}件 (${Math.round(done / total * 100)}%) ・ 列${columns.length} ・ イテレーション${iterations.length}`
          : "タスクはまだありません";
}

function renderBoard() {
  const f = getFilters();
  const board = document.getElementById("board");
  board.innerHTML = "";

  columns.forEach((col, idx) => {
    const colEl = document.createElement("div");
    colEl.className = "column";

    const items = tasks
      .filter(t => t.column_id === col.id && matchFilter(t, f))
      .sort((a, b) => a.position - b.position);

    const head = document.createElement("div");
    head.className = "column-head" + (col.is_done ? " is-done" : "");
    head.innerHTML = `
      <span class="dot"></span>
      <span class="cname">${escapeHtml(col.name)}</span>
      <span class="count">${items.length}</span>
      <span class="col-actions">
        <button class="icon-btn" data-act="left" title="左へ" ${idx === 0 ? "disabled" : ""}>◀</button>
        <button class="icon-btn" data-act="right" title="右へ" ${idx === columns.length - 1 ? "disabled" : ""}>▶</button>
        <button class="icon-btn" data-act="edit" title="編集">✎</button>
        <button class="icon-btn danger" data-act="del" title="削除">🗑</button>
      </span>`;
    head.querySelector('[data-act="left"]').onclick = () => moveColumn(col, -1);
    head.querySelector('[data-act="right"]').onclick = () => moveColumn(col, 1);
    head.querySelector('[data-act="edit"]').onclick = () => openColModal(col);
    head.querySelector('[data-act="del"]').onclick = () => delColumn(col);
    colEl.appendChild(head);

    const list = document.createElement("div");
    list.className = "cards";
    if (items.length === 0) {
      const e = document.createElement("div");
      e.className = "empty"; e.textContent = "タスクなし";
      list.appendChild(e);
    }
    items.forEach(t => list.appendChild(cardEl(t, "board")));
    colEl.appendChild(list);
    setupDropList(list, { field: "column_id", value: col.id });

    board.appendChild(colEl);
  });

  // 列追加タイル
  const add = document.createElement("div");
  add.className = "add-column";
  add.innerHTML = `<button>+ 列を追加</button>`;
  add.querySelector("button").onclick = () => openColModal(null);
  board.appendChild(add);
}

function renderBacklog() {
  const wrap = document.getElementById("backlogWrap");
  wrap.innerHTML = "";
  wrap.appendChild(panelEl(
    { id: null, title: "📥 プロダクトバックログ", isBacklog: true },
    tasks.filter(t => t.iteration_id == null)
  ));
  iterations.forEach(it => {
    wrap.appendChild(panelEl({ id: it.id, iter: it }, tasks.filter(t => t.iteration_id === it.id)));
  });
}

function panelEl(meta, items) {
  const panel = document.createElement("div");
  panel.className = "panel" + (meta.isBacklog ? " backlog-panel" : "");

  const head = document.createElement("div");
  head.className = "panel-head";
  if (meta.isBacklog) {
    head.innerHTML = `<span class="pname">${meta.title}</span><span class="count">${items.length}</span>`;
  } else {
    const it = meta.iter;
    const done = items.filter(isDoneTask).length;
    const range = (it.start_date || it.end_date)
      ? `<span class="pdate">${fmtDateShort(it.start_date) || "?"} 〜 ${fmtDateShort(it.end_date) || "?"}</span>` : "";
    head.innerHTML = `
      <span class="pname">${escapeHtml(it.name)}</span>
      <span class="iter-status ${it.status}">${ITER_STATUS_LABEL[it.status]}</span>
      ${range}
      <span class="count">${done}/${items.length}</span>
      <span class="pactions">
        <button class="icon-btn" data-act="edit-iter">✎ 編集</button>
        <button class="icon-btn danger" data-act="del-iter">🗑 削除</button>
      </span>
      ${it.goal ? `<span class="pgoal">🎯 ${escapeHtml(it.goal)}</span>` : ""}`;
    head.querySelector('[data-act="edit-iter"]').onclick = () => openIterModal(it);
    head.querySelector('[data-act="del-iter"]').onclick = () => delIteration(it);
  }
  panel.appendChild(head);

  const body = document.createElement("div");
  body.className = "panel-cards";
  if (items.length === 0) {
    const e = document.createElement("div");
    e.className = "empty"; e.textContent = "ここにタスクをドラッグ";
    body.appendChild(e);
  }
  items.sort((a, b) => a.position - b.position).forEach(t => body.appendChild(cardEl(t, "backlog")));
  panel.appendChild(body);

  setupDropList(body, { field: "iteration_id", value: meta.id });
  return panel;
}

function cardEl(t, ctx) {
  const el = document.createElement("div");
  el.className = `card p-${t.priority}` + (isDoneTask(t) ? " done" : "");
  el.draggable = true;
  el.dataset.id = t.id;

  let meta = `<span class="badge badge-prio p-${t.priority}">${PRIO_LABEL[t.priority]}</span>`;
  if (t.type_id != null) {
    const tn = typeName(t.type_id);
    if (tn) meta += `<span class="badge badge-type">${escapeHtml(tn)}</span>`;
  }
  if (ctx === "backlog") {
    const c = columnById(t.column_id);
    if (c) meta += `<span class="badge badge-col ${c.is_done ? "done" : ""}">${escapeHtml(c.name)}</span>`;
  }
  const due = fmtDue(t.due_date, isDoneTask(t));
  if (due) meta += `<span class="badge badge-due ${due.cls}">📅 ${due.label}</span>`;
  if (t.category) meta += `<span class="badge badge-cat">${escapeHtml(t.category)}</span>`;
  if (ctx === "board" && t.iteration_id != null) {
    const n = iterName(t.iteration_id);
    if (n) meta += `<span class="badge badge-iter">🔁 ${escapeHtml(n)}</span>`;
  }
  (t.tags || []).forEach(tag => meta += `<span class="badge badge-tag">#${escapeHtml(tag)}</span>`);

  const moveBtn = ctx === "board" ? `<button class="icon-btn" data-act="move">→ 次の列</button>` : "";

  el.innerHTML = `
    <div class="card-title">${escapeHtml(t.title)}</div>
    ${t.description ? `<div class="card-desc">${escapeHtml(t.description)}</div>` : ""}
    <div class="card-meta">${meta}</div>
    <div class="card-actions">
      <button class="icon-btn" data-act="edit">✎ 編集</button>
      ${moveBtn}
      <button class="icon-btn danger" data-act="del">🗑 削除</button>
    </div>`;

  el.querySelector('[data-act="edit"]').onclick = () => openModal(t);
  el.querySelector('[data-act="del"]').onclick = () => delTask(t.id);
  const mb = el.querySelector('[data-act="move"]');
  if (mb) mb.onclick = () => cycleColumn(t);

  el.addEventListener("dragstart", e => {
    dropDone = false;
    el.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", String(t.id));
  });
  el.addEventListener("dragend", () => {
    el.classList.remove("dragging");
    if (!dropDone) render();
  });
  return el;
}

function refreshFilterOptions() {
  const cats = [...new Set(tasks.map(t => t.category).filter(Boolean))].sort();
  const tags = [...new Set(tasks.flatMap(t => t.tags || []))].sort();
  syncSelect("filterCategory", cats.map(v => [v, v]), "カテゴリ: すべて");
  syncSelect("filterTag", tags.map(v => [v, v]), "タグ: すべて");
  const iterOpts = [["none", "バックログ(未割り当て)"]].concat(iterations.map(i => [String(i.id), i.name]));
  syncSelect("filterIteration", iterOpts, "イテレーション: すべて");
  const typeOpts = [["none", "種別なし"]].concat(taskTypes.map(t => [String(t.id), t.name]));
  syncSelect("filterType", typeOpts, "種別: すべて");
}
function refreshIterationSelects() {
  const sel = document.getElementById("f-iteration");
  const cur = sel.value;
  sel.innerHTML = `<option value="">バックログ(未割り当て)</option>` +
    iterations.map(i => `<option value="${i.id}">${escapeHtml(i.name)}</option>`).join("");
  sel.value = cur;
}
function refreshTypeSelect() {
  const sel = document.getElementById("f-type");
  const cur = sel.value;
  sel.innerHTML = `<option value="">種別なし</option>` +
    taskTypes.map(t => `<option value="${t.id}">${escapeHtml(t.name)}</option>`).join("");
  if (taskTypes.some(t => String(t.id) === cur)) sel.value = cur;
}
function refreshColumnSelect() {
  const sel = document.getElementById("f-column");
  const cur = sel.value;
  sel.innerHTML = columns.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("");
  if (columns.some(c => String(c.id) === cur)) sel.value = cur;
}
function syncSelect(id, pairs, placeholder) {
  const sel = document.getElementById(id);
  const cur = sel.value;
  sel.innerHTML = `<option value="">${placeholder}</option>` +
    pairs.map(([v, label]) => `<option value="${escapeHtml(v)}">${escapeHtml(label)}</option>`).join("");
  if (pairs.some(([v]) => v === cur)) sel.value = cur;
}

// ---- タスク操作 ----
function cycleColumn(t) {
  if (columns.length < 2) return;
  const idx = columns.findIndex(c => c.id === t.column_id);
  const next = columns[(idx + 1) % columns.length];
  updateTask(t.id, { column_id: next.id });
}
async function updateTask(id, patch) {
  try {
    const updated = await api(TASK_API, "PUT", "/" + id, patch);
    const i = tasks.findIndex(t => t.id === id);
    if (i >= 0) tasks[i] = updated;
    render();
  } catch (e) { alert("更新に失敗: " + e.message); }
}
async function delTask(id) {
  if (!confirm("このタスクを削除しますか?")) return;
  try {
    await api(TASK_API, "DELETE", "/" + id);
    tasks = tasks.filter(t => t.id !== id);
    render();
  } catch (e) { alert("削除に失敗: " + e.message); }
}

// ---- タスクモーダル ----
const overlay = document.getElementById("overlay");
const form = document.getElementById("taskForm");
function openModal(t, presetCol) {
  document.getElementById("modalTitle").textContent = t ? "タスクを編集" : "新規タスク";
  document.getElementById("taskId").value = t ? t.id : "";
  document.getElementById("f-title").value = t ? t.title : "";
  document.getElementById("f-desc").value = t ? t.description : "";
  document.getElementById("f-priority").value = t ? t.priority : "mid";
  refreshColumnSelect();
  document.getElementById("f-column").value =
    String(t ? t.column_id : (presetCol != null ? presetCol : (columns[0] && columns[0].id)));
  refreshIterationSelects();
  document.getElementById("f-iteration").value =
    t ? (t.iteration_id != null ? String(t.iteration_id) : "") : "";
  refreshTypeSelect();
  document.getElementById("f-type").value =
    t ? (t.type_id != null ? String(t.type_id) : "") : "";
  document.getElementById("f-due").value = t ? (t.due_date || "") : "";
  document.getElementById("f-category").value = t ? t.category : "";
  document.getElementById("f-tags").value = t ? (t.tags || []).join(", ") : "";
  overlay.classList.add("open");
  document.getElementById("f-title").focus();
}
function closeModal() { overlay.classList.remove("open"); }
form.addEventListener("submit", async e => {
  e.preventDefault();
  const id = document.getElementById("taskId").value;
  const iterVal = document.getElementById("f-iteration").value;
  const typeVal = document.getElementById("f-type").value;
  const payload = {
    title: document.getElementById("f-title").value.trim(),
    description: document.getElementById("f-desc").value.trim(),
    column_id: Number(document.getElementById("f-column").value),
    priority: document.getElementById("f-priority").value,
    iteration_id: iterVal === "" ? null : Number(iterVal),
    type_id: typeVal === "" ? null : Number(typeVal),
    due_date: document.getElementById("f-due").value || null,
    category: document.getElementById("f-category").value.trim(),
    tags: document.getElementById("f-tags").value.split(",").map(s => s.trim()).filter(Boolean),
  };
  if (!payload.title) return;
  try {
    if (id) await updateTask(Number(id), payload);
    else {
      const created = await api(TASK_API, "POST", "", { ...payload, project_id: activeProjectId });
      tasks.push(created); render();
    }
    closeModal();
  } catch (err) { alert("保存に失敗: " + err.message); }
});

// ---- 列操作 ----
const colOverlay = document.getElementById("colOverlay");
const colForm = document.getElementById("colForm");
function openColModal(col) {
  document.getElementById("colModalTitle").textContent = col ? "列を編集" : "新規列";
  document.getElementById("colId").value = col ? col.id : "";
  document.getElementById("c-name").value = col ? col.name : "";
  document.getElementById("c-done").checked = col ? !!col.is_done : false;
  colOverlay.classList.add("open");
  document.getElementById("c-name").focus();
}
function closeColModal() { colOverlay.classList.remove("open"); }
colForm.addEventListener("submit", async e => {
  e.preventDefault();
  const id = document.getElementById("colId").value;
  const payload = {
    name: document.getElementById("c-name").value.trim(),
    is_done: document.getElementById("c-done").checked,
  };
  if (!payload.name) return;
  try {
    if (id) await api(COL_API, "PUT", "/" + id, payload);
    else await api(COL_API, "POST", "", { ...payload, project_id: activeProjectId });
    await load();
    closeColModal();
  } catch (err) { alert("保存に失敗: " + err.message); }
});
async function moveColumn(col, dir) {
  const idx = columns.findIndex(c => c.id === col.id);
  const swap = idx + dir;
  if (swap < 0 || swap >= columns.length) return;
  const ids = columns.map(c => c.id);
  [ids[idx], ids[swap]] = [ids[swap], ids[idx]];
  try {
    columns = await api(COL_API, "POST", "/reorder", { ids, project_id: activeProjectId });
    render();
  } catch (e) { alert("並び替えに失敗: " + e.message); }
}
async function delColumn(col) {
  if (columns.length <= 1) { alert("最後の列は削除できません。"); return; }
  const n = tasks.filter(t => t.column_id === col.id).length;
  const msg = n > 0
    ? `列「${col.name}」を削除しますか?\n中の${n}件のタスクは隣の列へ移動します(削除されません)。`
    : `列「${col.name}」を削除しますか?`;
  if (!confirm(msg)) return;
  try {
    await api(COL_API, "DELETE", "/" + col.id);
    await load();
  } catch (e) { alert("削除に失敗: " + e.message); }
}

// ---- イテレーション操作 ----
const iterOverlay = document.getElementById("iterOverlay");
const iterForm = document.getElementById("iterForm");
function openIterModal(it) {
  document.getElementById("iterModalTitle").textContent = it ? "イテレーションを編集" : "新規イテレーション";
  document.getElementById("iterId").value = it ? it.id : "";
  document.getElementById("i-name").value = it ? it.name : "";
  document.getElementById("i-goal").value = it ? it.goal : "";
  document.getElementById("i-start").value = it ? (it.start_date || "") : "";
  document.getElementById("i-end").value = it ? (it.end_date || "") : "";
  document.getElementById("i-status").value = it ? it.status : "planned";
  iterOverlay.classList.add("open");
  document.getElementById("i-name").focus();
}
function closeIterModal() { iterOverlay.classList.remove("open"); }
iterForm.addEventListener("submit", async e => {
  e.preventDefault();
  const id = document.getElementById("iterId").value;
  const payload = {
    name: document.getElementById("i-name").value.trim(),
    goal: document.getElementById("i-goal").value.trim(),
    start_date: document.getElementById("i-start").value || null,
    end_date: document.getElementById("i-end").value || null,
    status: document.getElementById("i-status").value,
  };
  if (!payload.name) return;
  try {
    if (id) {
      const updated = await api(ITER_API, "PUT", "/" + id, payload);
      const i = iterations.findIndex(x => x.id === Number(id));
      if (i >= 0) iterations[i] = updated;
    } else {
      const created = await api(ITER_API, "POST", "", { ...payload, project_id: activeProjectId });
      iterations.push(created);
    }
    render();
    closeIterModal();
  } catch (err) { alert("保存に失敗: " + err.message); }
});
async function delIteration(it) {
  const n = tasks.filter(t => t.iteration_id === it.id).length;
  const msg = n > 0
    ? `「${it.name}」を削除しますか?\n配下の${n}件のタスクはプロダクトバックログに戻ります(削除されません)。`
    : `「${it.name}」を削除しますか?`;
  if (!confirm(msg)) return;
  try {
    await api(ITER_API, "DELETE", "/" + it.id);
    iterations = iterations.filter(x => x.id !== it.id);
    tasks.forEach(t => { if (t.iteration_id === it.id) t.iteration_id = null; });
    render();
  } catch (e) { alert("削除に失敗: " + e.message); }
}

// ---- ドラッグ&ドロップ(並び替え + グループ移動) ----
function getDragAfterElement(container, y) {
  const els = [...container.querySelectorAll(".card:not(.dragging)")];
  let closest = { offset: -Infinity, element: null };
  for (const child of els) {
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height / 2;
    if (offset < 0 && offset > closest.offset) closest = { offset, element: child };
  }
  return closest.element;
}
function setupDropList(container, group) {
  container.addEventListener("dragover", e => {
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    container.classList.add("dragover");
    const dragging = document.querySelector(".card.dragging");
    if (!dragging) return;
    const ph = container.querySelector(".empty");
    if (ph) ph.remove();
    const after = getDragAfterElement(container, e.clientY);
    if (after == null) container.appendChild(dragging);
    else container.insertBefore(dragging, after);
  });
  container.addEventListener("dragleave", e => {
    if (!container.contains(e.relatedTarget)) container.classList.remove("dragover");
  });
  container.addEventListener("drop", async e => {
    e.preventDefault();
    dropDone = true;
    container.classList.remove("dragover");
    const id = Number(e.dataTransfer.getData("text/plain"));
    if (!id) return;
    const ids = [...container.querySelectorAll(".card")].map(c => Number(c.dataset.id));
    const t = tasks.find(x => x.id === id);
    const payload = { ids, moved_id: id, project_id: activeProjectId };
    if (t) {
      if (group.field === "column_id" && t.column_id !== group.value) payload.column_id = group.value;
      if (group.field === "iteration_id" && (t.iteration_id ?? null) !== (group.value ?? null))
        payload.iteration_id = group.value;
    }
    try {
      tasks = await api(TASK_API, "POST", "/reorder", payload);
      render();
    } catch (err) { alert("並び替えの保存に失敗: " + err.message); render(); }
  });
}

// ============ 認証 ============
function showAuthScreen() {

  document.getElementById("appHeader").style.display = "none";
  ["view-board", "view-backlog", "view-noproject"].forEach(id =>
    document.getElementById(id).classList.remove("active"));
  document.getElementById("toolbar").style.display = "none";
  currentUser = null;
}
function hideAuthScreen() {
  document.getElementById("authScreen").classList.remove("open");
  document.getElementById("appHeader").style.display = "flex";
}
function setCurrentUser(u) {
  currentUser = u;
  document.getElementById("userName").innerHTML =
    escapeHtml(u.username) + (u.is_admin ? ' <span class="tag-admin">管理者</span>' : "");
  document.getElementById("adminBtn").style.display = u.is_admin ? "" : "none";
}
async function boot() {
  let me;
  try {
    const res = await fetch("/api/auth/me");
    if (res.status === 401) { showAuthScreen(); return; }
    me = await res.json();
  } catch (e) { showAuthScreen(); return; }
  hideAuthScreen();
  setCurrentUser(me);
  await loadProjects();
}

    await loadProjects();

});
document.getElementById("logoutBtn").onclick = async () => {

// ============ プロジェクト ============
async function loadProjects() {
  try {
    projects = await api("/api/projects", "GET");
  } catch (e) { projects = []; }
  // アクティブプロジェクトの決定(前回選択 → 先頭)
  const saved = Number(localStorage.getItem(LS_PROJECT));
  if (projects.some(p => p.id === saved)) activeProjectId = saved;
  else activeProjectId = projects.length ? projects[0].id : null;
  if (activeProjectId) localStorage.setItem(LS_PROJECT, activeProjectId);
  renderProjectSelect();
  applyView();
  await load();
}
function renderProjectSelect() {
  const sel = document.getElementById("projectSelect");
  sel.innerHTML = projects.map(p =>
    `<option value="${p.id}">${escapeHtml(p.name)}${p.my_role === "owner" ? " ★" : ""}</option>`
  ).join("") + `<option value="__new__">＋ 新規プロジェクト…</option>`;
  if (activeProjectId) sel.value = String(activeProjectId);
  document.getElementById("manageProjectBtn").style.display = activeProjectId ? "" : "none";
}
document.getElementById("projectSelect").onchange = async e => {
  const v = e.target.value;
  if (v === "__new__") { renderProjectSelect(); openProjModal(null); return; }
  activeProjectId = Number(v);
  localStorage.setItem(LS_PROJECT, activeProjectId);
  applyView();
  await load();
};

    activeProjectId = null;

};
async function renderMembers() {
  const wrap = document.getElementById("mg-members");
  wrap.innerHTML = "読み込み中…";
  let members;
  try {
    members = await api(`/api/projects/${activeProjectId}/members`, "GET");
  } catch (e) { wrap.textContent = e.message; return; }
  const owner = isOwner();
  wrap.innerHTML = "";
  members.forEach(m => {
    const row = document.createElement("div");
    row.className = "list-row";
    const removable = owner && m.role !== "owner";
    row.innerHTML = `
      <span class="name grow">${escapeHtml(m.username)}${m.user_id === currentUser.id ? "(自分)" : ""}</span>
      <span class="role-pill ${m.role}">${m.role === "owner" ? "オーナー" : "メンバー"}</span>
      ${removable ? `<button class="btn btn-ghost btn-sm" data-uid="${m.user_id}">削除</button>` : ""}`;
    const btn = row.querySelector("button");
    if (btn) btn.onclick = async () => {
      if (!confirm(`${m.username} をこのプロジェクトから外しますか?`)) return;
      try { await api(`/api/projects/${activeProjectId}/members`, "DELETE", "/" + m.user_id); await renderMembers(); }
      catch (err) { document.getElementById("mg-error").textContent = err.message; }
    };
    wrap.appendChild(row);
  });
}
document.getElementById("addMemberForm").addEventListener("submit", async e => {
  e.preventDefault();

  document.getElementById("t-name").value = "";

  renderTypeList();

document.getElementById("typeCloseBtn").onclick = closeTypeManage;
typeOverlay.onclick = e => { if (e.target === typeOverlay) closeTypeManage(); };
function renderTypeList() {
  const wrap = document.getElementById("type-list");
  wrap.innerHTML = "";
  if (taskTypes.length === 0) {
    wrap.innerHTML = `<div class="empty">種別がありません。下のフォームから追加してください。</div>`;
    return;
  }
  taskTypes.forEach(ty => {
    const n = tasks.filter(t => t.type_id === ty.id).length;
    const row = document.createElement("div");
    row.className = "list-row";
    row.innerHTML = `
      <span class="badge badge-type">${escapeHtml(ty.name)}</span>
      <span class="grow" style="font-size:12px; color:var(--muted);">${n}件のタスク</span>
      <button class="btn btn-ghost btn-sm" data-act="rename">✎ 改名</button>
      <button class="btn btn-ghost btn-sm" data-act="del">🗑 削除</button>`;
    row.querySelector('[data-act="rename"]').onclick = async () => {
      const name = prompt("種別の新しい名前", ty.name);
      if (name == null) return;
      if (!name.trim()) return;
      try { await api(TYPE_API, "PUT", "/" + ty.id, { name: name.trim() }); await load(); renderTypeList(); }
      catch (err) { document.getElementById("type-error").textContent = err.message; }
    };
    row.querySelector('[data-act="del"]').onclick = async () => {
      const msg = n > 0
        ? `種別「${ty.name}」を削除しますか?\n${n}件のタスクは「種別なし」に戻ります(削除されません)。`
        : `種別「${ty.name}」を削除しますか?`;
      if (!confirm(msg)) return;
      try { await api(TYPE_API, "DELETE", "/" + ty.id); await load(); renderTypeList(); }
      catch (err) { document.getElementById("type-error").textContent = err.message; }
    };
    wrap.appendChild(row);
  });
}
